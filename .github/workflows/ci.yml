name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 24.16.0
          - 26.1.0
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build plugin and Control UI
        run: npm run plugin:build

      - name: Check generated OpenClaw metadata
        run: npm run plugin:build:check

      - name: Validate ClawHub plugin package
        run: npm run plugin:validate

      - name: Check npm package contents
        run: npm run package:check
  macos-staging:
    name: macOS staging (Node.js 24.16.0)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24.16.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Exercise workspace staging through native approval preflight
        run: npx --no-install vitest run --config ./vitest.config.ts src/stage-workspace-file.test.ts src/one-call-staging.integration.test.ts src/media-write.integration.test.ts src/mutation-validation.integration.test.ts src/vault-authorization.integration.test.ts
