name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node.js ${{ matrix.check-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Preserve required-check identities; qualify the Node 26 line on its patched release.
        include:
          - node-version: 24.16.0
            check-version: 24.16.0
          - node-version: 26.13.0
            check-version: 26.1.0
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keep the minimum host/SDK on Node 24; exercise current stable on Node 26.
      - name: Use current stable OpenClaw
        if: matrix.node-version == '26.13.0'
        run: npm install --no-save --package-lock=false openclaw@2026.11.3

      - name: Run tests
        run: npm test -- --maxWorkers=2

      - name: Build plugin and Control UI
        if: matrix.node-version == '26.13.0'
        run: npm run plugin:build

      - name: Check generated OpenClaw metadata
        if: matrix.node-version == '26.13.0'
        run: npm run plugin:build:check

      - name: Validate OpenClaw plugin
        if: matrix.node-version == '26.13.0'
        run: npm run plugin:validate

      - name: Check npm package contents
        if: matrix.node-version == '26.13.0'
        run: npm run package:check

      - name: Validate ClawHub package
        if: matrix.node-version == '26.13.0'
        run: npx --no-install clawhub package validate . --openclaw-version 2026.11.3
  macos-staging:
    name: macOS staging (Node.js 26.13.0)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 26.13.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Exercise workspace staging through native approval preflight
        run: npx --no-install vitest run --maxWorkers=2 --config ./vitest.config.ts src/stage-workspace-file.test.ts src/one-call-staging.integration.test.ts src/workspace-context-cross-module.test.ts src/media-write.integration.test.ts
